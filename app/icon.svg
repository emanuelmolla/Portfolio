<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Emanuel Molla">
  <!--
    The favicon: a capital E set in Fraunces, weight 700, optical size 9.

    WHY THIS LETTER. The v1 mark was a terminal prompt in pure white on
    transparency: invisible on a light tab strip, and at 16px the underscore
    collapsed to a smear. Candidates were compared at TRUE 16px, because that is
    the size that decides a favicon and judging one at 512px is how the old one
    ended up unreadable. A prompt cannot survive it: two small shapes with a gap,
    and 16px has no room for a gap. A letter can, and an E says Emanuel where a
    prompt says "a developer", which is true of several million people.

    WHY THIS FONT. Two earlier attempts were wrong in opposite directions. The
    first drew the E from rectangles by hand and looked synthetic, because it was.
    The second used Instrument Sans, the site's own text face, which is correct
    brand thinking and produced a plain grotesque E with no character at all.
    Fraunces is a display serif with flared, slightly wedged terminals: it reads
    as a designed mark rather than a letter that happened to be typed.

    WHY OPTICAL SIZE 9 AND NOT 144. Fraunces carries an optical size axis, and
    this is exactly what that axis is for. The display cut (opsz 144) has fine
    hairlines that look beautiful at 512px and lose the middle arm at 16px, where
    the E turns into a stem with a blur beside it. The text cut (opsz 9) is drawn
    with sturdier strokes for small sizes: it survives 16px intact and still has
    the flared serifs at full size. One cut is used everywhere, because the SVG is
    rendered at every size including 16px on a 1x display, so it has to hold there.

    The outline is a single contour, so winding rule does not matter here, unlike
    the Instrument Sans version which was four overlapping rectangles.

    Geometry: cap height 330 in a 512 box, ink 276x330, centred on both axes.

    Green rather than neutral ink: it is the site accent in both schemes (--accent
    in app/globals.css), and a coloured mark is findable in a row of twenty tabs.
    prefers-color-scheme is what fixes the original invisibility, one asset legible
    on a light strip and a dark one.

    app/favicon.ico and app/apple-icon.png are generated from this same outline.
  -->
  <style>
    :root { --mark: #17763c; }
    @media (prefers-color-scheme: dark) { :root { --mark: #41d67c; } }
  </style>

