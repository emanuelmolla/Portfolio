<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Emanuel Molla">
  <!--
    The favicon. Source of truth; app/favicon.ico and app/apple-icon.png are
    generated from these same coordinates.

    WHY A LETTER AND NOT THE OLD >_ PROMPT.

    The v1 mark was a terminal prompt in pure white on transparency. Two problems:
    it was invisible on a light tab strip, and at 16px the underscore collapsed to
    a 2px smear while the chevron read as a generic diagonal. Candidates were
    rendered at true 16px and compared before choosing; the prompt does not
    survive that size no matter how it is weighted, because it is two small shapes
    separated by a gap and 16px has no room for a gap.

    The deeper reason is what the mark says. A terminal prompt says "a developer",
    which is true of several million people. An E says Emanuel. A favicon's job is
    recognition in a strip of twenty tabs, and being identifiably his beats being
    thematically clever.

    PROPORTIONS. Arms at the top, the true vertical centre, and the bottom, with
    the middle arm shorter, which is what a drawn E does. An earlier attempt put
    the middle arm at 46% of the height and it read as a broken C.

    Optically centred: the ink spans x 146..366, so its midpoint is 256.
    The three arms sit at y 106, 216 and 326, which leaves two counters of exactly
    30px. An earlier version had the bottom arm at 326-20, which left a stub of
    stem hanging below it and made the lower counter a third of the upper one.

    GREEN rather than neutral ink. It is the site accent in both schemes (--accent
    in app/globals.css), and a coloured mark is findable in a row of tabs where a
    dark grey glyph is not.

    prefers-color-scheme is what fixes the original invisibility: one asset, legible
    on a light tab strip and a dark one.

    The alternative that came second was the chevron alone, refined:
      <path d="..."/> from stroking (152,126) -> (360,256) -> (152,386) at width 92.
    It keeps the terminal association and is equally legible. Say the word and it
    swaps back.
  -->
  <style>
    :root { --mark: #17763c; }
    @media (prefers-color-scheme: dark) { :root { --mark: #41d67c; } }
  </style>

  <g fill="var(--mark)">
    <rect x="146" y="106" width="80"  height="300" />
    <rect x="146" y="106" width="220" height="80" />
    <rect x="146" y="216" width="180" height="80" />
    <rect x="146" y="326" width="220" height="80" />
  </g>
</svg>
