<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Emanuel Molla">
  <!--
    The favicon: a capital E set in Instrument Sans 700.

    WHY THIS LETTER, FROM THIS FONT.

    The v1 mark was a terminal prompt in pure white on transparency: invisible on
    a light tab strip, and at 16px the underscore collapsed to a smear while the
    chevron read as a generic diagonal. Candidates were compared at true 16px
    before choosing, because that is the size that decides a favicon and judging
    one at 512px is how the old one ended up unreadable. A prompt cannot survive
    16px in any weighting: it is two small shapes separated by a gap, and 16px has
    no room for a gap.

    The glyph is lifted from the real typeface rather than drawn from rectangles.
    An earlier attempt constructed the E by hand and it looked synthetic, because
    it was: 80px strokes against 30px counters, which reads as a slab with two
    slots rather than a letter. Letterforms are a solved problem and the solution
    is a font.

    Instrument Sans specifically, at 700, because it is the site's own text face
    (see app/layout.tsx). The favicon and the headings are now the same letter.
    The 700 weight rather than 400 or 500: at 16px a text weight goes spindly and
    the counters fill in.

    The path is four overlapping rectangles, which is how this font builds an E.
    That means it needs NONZERO winding, not even-odd, or the overlaps punch holes
    at the junctions. Nonzero is the SVG default, so nothing is declared here, but
    anything regenerating the raster versions has to know.

    Geometry: cap height 330 in a 512 box, ink spanning x 133.2..378.8 and
    y 91..421, so it is centred on both axes.

    Green rather than neutral ink: it is the site accent in both schemes (--accent
    in app/globals.css), and a coloured mark is findable in a row of twenty tabs
    where a dark grey glyph is not. prefers-color-scheme is what fixes the
    original invisibility, one asset legible on a light strip and a dark one.

    app/favicon.ico and app/apple-icon.png are generated from this same outline.
  -->
  <style>
    :root { --mark: #17763c; }
    @media (prefers-color-scheme: dark) { :root { --mark: #41d67c; } }
  </style>

  <path
    fill="var(--mark)"
    d="M133.2 421.0V91.0H203.8V421.0ZM166.2 421.0V366.9H378.8V421.0ZM166.2 278.9V225.8H362.8V278.9ZM166.2 145.1V91.0H373.3V145.1Z"
  />
</svg>
